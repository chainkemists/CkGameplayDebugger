<ui version="1">

        <row id="ism-proxy-mobility-row" class="ism-proxy-row"><text id="ism-proxy-mobility-label" color-bind="ism-proxy-mobility-diff-color" class="ism-proxy-label">Mobility:</text><text id="ism-proxy-mobility-value" bind="ism-proxy-mobility" class="ism-proxy-enum-value" /></row>
        <row id="ism-proxy-location-row" class="ism-proxy-row"><text id="ism-proxy-location-label" color-bind="ism-proxy-location-diff-color" class="ism-proxy-label">Location Offset:</text><row id="ism-proxy-location-values" class="ism-proxy-axis-values"><text id="ism-proxy-location-x" bind="ism-proxy-location-x" class="ism-proxy-axis-x" /><text id="ism-proxy-location-y" bind="ism-proxy-location-y" class="ism-proxy-axis-y" /><text id="ism-proxy-location-z" bind="ism-proxy-location-z" class="ism-proxy-axis-z" /></row></row>

        <row id="ism-proxy-scale-row" class="ism-proxy-row"><text id="ism-proxy-scale-label" color-bind="ism-proxy-scale-diff-color" class="ism-proxy-label">Scale Multiplier:</text><row id="ism-proxy-scale-values" class="ism-proxy-axis-values"><text id="ism-proxy-scale-x" bind="ism-proxy-scale-x" class="ism-proxy-axis-x" /><text id="ism-proxy-scale-y" bind="ism-proxy-scale-y" class="ism-proxy-axis-y" /><text id="ism-proxy-scale-z" bind="ism-proxy-scale-z" class="ism-proxy-axis-z" /></row></row>
        <text id="ism-proxy-controls-heading" class="ism-proxy-heading">Controls</text>

        <row id="ism-proxy-custom-value-row" class="ism-proxy-row"><text id="ism-proxy-custom-value-label" color-bind="ism-proxy-value-diff-color" tooltip-bind="ism-proxy-custom-value-tooltip" class="ism-proxy-label">Value:</text><number-input id="ism-proxy-custom-value-input" value-bind="ism-proxy-custom-value" committed="ism-proxy-custom-value-committed" kind="float" fractional-digits="3" enabled-bind="ism-proxy-can-edit-value" class="ism-proxy-number" /></row>
