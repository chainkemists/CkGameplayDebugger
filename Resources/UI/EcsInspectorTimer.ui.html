<ui version="1">
  <region name="main">
    <column id="timer-inspector" class="timer-inspector">
      <text id="timer-identity-header" class="timer-header">Identity</text>
      <row id="timer-name-row" class="timer-row"><text id="timer-name-label" color-bind="timer-name-diff-color" class="timer-label">Name:</text><text id="timer-name-value" bind="timer-name" class="timer-value timer-tag" /></row>
      <text id="timer-configuration-header" class="timer-header">Configuration</text>
      <row id="timer-direction-row" class="timer-row"><text id="timer-direction-label" color-bind="timer-direction-diff-color" class="timer-label">Direction:</text><text id="timer-direction-value" bind="timer-direction" class="timer-value timer-enum" /></row>
      <row id="timer-behavior-row" class="timer-row"><text id="timer-behavior-label" color-bind="timer-behavior-diff-color" class="timer-label">Behavior:</text><text id="timer-behavior-value" bind="timer-behavior" class="timer-value timer-enum" /></row>
      <text id="timer-live-header" class="timer-header">Live State</text>
      <row id="timer-state-row" class="timer-row"><text id="timer-state-label" color-bind="timer-state-diff-color" class="timer-label">State:</text><debug-status id="timer-state-value" label-bind="timer-state" foreground-bind="timer-state-foreground" background-bind="timer-state-background" show-dot="true" class="timer-status" /></row>
      <row id="timer-goal-row" class="timer-row"><text id="timer-goal-label" color-bind="timer-goal-diff-color" class="timer-label">Goal:</text><text id="timer-goal-value" bind="timer-goal" class="timer-value timer-number" /></row>
      <row id="timer-elapsed-row" class="timer-row"><text id="timer-elapsed-label" color-bind="timer-elapsed-diff-color" class="timer-label">Elapsed:</text><row id="timer-elapsed-value" class="timer-meter"><debug-meter id="timer-elapsed-meter" fraction-bind="timer-elapsed-fraction" fill-bind="timer-elapsed-fill" width="72" height="6" /><text id="timer-elapsed-text" bind="timer-elapsed" class="timer-value timer-number" /></row></row>
      <row id="timer-remaining-row" class="timer-row"><text id="timer-remaining-label" color-bind="timer-remaining-diff-color" class="timer-label">Remaining:</text><text id="timer-remaining-value" bind="timer-remaining" class="timer-value timer-number" /></row>
      <row id="timer-done-row" class="timer-row"><text id="timer-done-label" color-bind="timer-done-diff-color" class="timer-label">Done:</text><text id="timer-done-value" bind="timer-done" color-bind="timer-done-color" class="timer-value" /></row>
      <text id="timer-controls-header" class="timer-header">Controls</text>
      <row id="timer-playback-row" class="timer-row"><text id="timer-playback-label" color-bind="timer-playback-diff-color" class="timer-label">Playback:</text><row id="timer-playback-actions" class="timer-actions"><debug-inspector-action id="timer-pause" label-bind="timer-pause-label" action="timer-pause" enabled-bind="timer-can-request" tooltip-bind="timer-pause-tooltip" disabled-reason-bind="timer-disabled-reason" class="timer-action" /><debug-inspector-action id="timer-resume" label-bind="timer-resume-label" action="timer-resume" enabled-bind="timer-can-request" tooltip-bind="timer-resume-tooltip" disabled-reason-bind="timer-disabled-reason" class="timer-action" /><debug-inspector-action id="timer-stop" label-bind="timer-stop-label" action="timer-stop" enabled-bind="timer-can-request" tooltip-bind="timer-stop-tooltip" disabled-reason-bind="timer-disabled-reason" class="timer-action" /></row></row>
      <row id="timer-position-row" class="timer-row"><text id="timer-position-label" color-bind="timer-position-diff-color" class="timer-label">Position:</text><row id="timer-position-actions" class="timer-actions"><debug-inspector-action id="timer-reset" label-bind="timer-reset-label" action="timer-reset" enabled-bind="timer-can-request" tooltip-bind="timer-reset-tooltip" disabled-reason-bind="timer-disabled-reason" class="timer-action" /><debug-inspector-action id="timer-complete" label-bind="timer-complete-label" action="timer-complete" enabled-bind="timer-can-request" tooltip-bind="timer-complete-tooltip" disabled-reason-bind="timer-disabled-reason" class="timer-action" /><debug-inspector-action id="timer-reverse" label-bind="timer-reverse-label" action="timer-reverse" enabled-bind="timer-can-request" tooltip-bind="timer-reverse-tooltip" disabled-reason-bind="timer-disabled-reason" class="timer-action" /></row></row>
      <row id="timer-set-direction-row" class="timer-row"><text id="timer-set-direction-label" color-bind="timer-set-direction-diff-color" class="timer-label">Set Direction:</text><native id="timer-set-direction-native" bind="timer-direction-port" class="timer-native" /></row>
      <row id="timer-jump-mode-row" class="timer-row"><text id="timer-jump-mode-label" color-bind="timer-jump-mode-diff-color" class="timer-label">Jump Mode:</text><native id="timer-jump-mode-native" bind="timer-jump-mode-port" class="timer-native" /></row>
      <row id="timer-jump-row" class="timer-row"><text id="timer-jump-label" color-bind="timer-jump-s-diff-color" class="timer-label">Jump (s):</text><native id="timer-jump-native" bind="timer-jump-port" class="timer-native" /></row>
      <row id="timer-consume-row" class="timer-row"><text id="timer-consume-label" color-bind="timer-consume-s-diff-color" class="timer-label">Consume (s):</text><native id="timer-consume-native" bind="timer-consume-port" class="timer-native" /></row>
    </column>
  </region>
</ui>
