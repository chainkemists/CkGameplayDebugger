<?xml version="1.0" encoding="UTF-8"?>
<!--
  Gamepad master art - source of truth for the device visualizer's gamepad brushes ([P11-D2]).
  Stylized-realistic Xbox-class layout. Per-control groups are split into per-layer SVGs and
  rasterized to the shipped PNGs via ImageMagick; the engine never consumes this file directly
  (UE's runtime SVG brush supports only a flat-fill subset and would drop every gradient here).
  Edit THIS file, then re-run the rasterization; never repaint the PNGs by hand.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640">
  <defs>
    <linearGradient id="bodyShell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f46"/>
      <stop offset="0.45" stop-color="#2b2f35"/>
      <stop offset="1" stop-color="#1d2024"/>
    </linearGradient>
    <linearGradient id="bodySheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="stickWell" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#0c0d0f"/>
      <stop offset="0.75" stop-color="#141619"/>
      <stop offset="1" stop-color="#33383f"/>
    </radialGradient>
    <radialGradient id="stickCap" cx="0.5" cy="0.38" r="0.65">
      <stop offset="0" stop-color="#43484f"/>
      <stop offset="0.55" stop-color="#2d3137"/>
      <stop offset="0.9" stop-color="#1a1d21"/>
      <stop offset="1" stop-color="#101214"/>
    </radialGradient>
    <radialGradient id="faceBtn" cx="0.5" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#3b4048"/>
      <stop offset="0.7" stop-color="#22262b"/>
      <stop offset="1" stop-color="#121417"/>
    </radialGradient>
    <linearGradient id="dpadFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33373d"/>
      <stop offset="0.5" stop-color="#22252a"/>
      <stop offset="1" stop-color="#16181c"/>
    </linearGradient>
    <linearGradient id="bumper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#41464e"/>
      <stop offset="0.6" stop-color="#2c3036"/>
      <stop offset="1" stop-color="#202329"/>
    </linearGradient>
    <linearGradient id="trigger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34383f"/>
      <stop offset="1" stop-color="#1b1e22"/>
    </linearGradient>
  </defs>

  <!-- ============ layer: body ============ -->
  <g id="layer_body">
    <path fill="url(#bodyShell)" stroke="#0d0e10" stroke-width="3"
      d="M 330,120
         C 390,96 610,96 670,120
         C 760,120 830,140 866,196
         C 906,260 936,380 924,470
         C 916,540 872,586 820,586
         C 768,586 740,528 712,488
         C 686,452 656,436 610,436
         L 390,436
         C 344,436 314,452 288,488
         C 260,528 232,586 180,586
         C 128,586 84,540 76,470
         C 64,380 94,260 134,196
         C 170,140 240,120 330,120 Z"/>
    <path fill="url(#bodySheen)"
      d="M 330,126 C 390,102 610,102 670,126 C 754,126 820,146 854,198
         C 866,218 876,244 884,272 C 700,236 300,236 116,272
         C 124,244 134,218 146,198 C 180,146 246,126 330,126 Z"/>
  </g>

  <!-- ============ layer: trigger_left (analog fill target) ============ -->
  <g id="layer_trigger_left">
    <rect x="200" y="18" width="110" height="84" rx="26" fill="url(#trigger)" stroke="#0d0e10" stroke-width="3"/>
    <text x="255" y="70" font-family="Segoe UI, Arial" font-size="34" font-weight="600" fill="#8b939d" text-anchor="middle">LT</text>
  </g>

  <!-- ============ layer: trigger_right ============ -->
  <g id="layer_trigger_right">
    <rect x="690" y="18" width="110" height="84" rx="26" fill="url(#trigger)" stroke="#0d0e10" stroke-width="3"/>
    <text x="745" y="70" font-family="Segoe UI, Arial" font-size="34" font-weight="600" fill="#8b939d" text-anchor="middle">RT</text>
  </g>

  <!-- ============ layer: bumper_left ============ -->
  <g id="layer_bumper_left">
    <path fill="url(#bumper)" stroke="#0d0e10" stroke-width="3"
      d="M 168,148 C 220,108 330,96 388,102 L 388,138 C 320,132 226,142 180,170 Z"/>
    <text x="278" y="136" font-family="Segoe UI, Arial" font-size="30" font-weight="600" fill="#8b939d" text-anchor="middle">LB</text>
  </g>

  <!-- ============ layer: bumper_right ============ -->
  <g id="layer_bumper_right">
    <path fill="url(#bumper)" stroke="#0d0e10" stroke-width="3"
      d="M 832,148 C 780,108 670,96 612,102 L 612,138 C 680,132 774,142 820,170 Z"/>
    <text x="722" y="136" font-family="Segoe UI, Arial" font-size="30" font-weight="600" fill="#8b939d" text-anchor="middle">RB</text>
  </g>

  <!-- ============ layer: stick_left_well ============ -->
  <g id="layer_stick_left_well">
    <circle cx="270" cy="262" r="62" fill="url(#stickWell)" stroke="#0d0e10" stroke-width="3"/>
  </g>

  <!-- ============ layer: stick_left_cap (translates with the axis pair) ============ -->
  <g id="layer_stick_left_cap">
    <circle cx="270" cy="262" r="44" fill="url(#stickCap)" stroke="#0a0b0c" stroke-width="2"/>
    <circle cx="270" cy="262" r="34" fill="none" stroke="#4a5058" stroke-width="3" stroke-dasharray="4 5"/>
  </g>

  <!-- ============ layer: stick_right_well ============ -->
  <g id="layer_stick_right_well">
    <circle cx="614" cy="356" r="62" fill="url(#stickWell)" stroke="#0d0e10" stroke-width="3"/>
  </g>

  <!-- ============ layer: stick_right_cap ============ -->
  <g id="layer_stick_right_cap">
    <circle cx="614" cy="356" r="44" fill="url(#stickCap)" stroke="#0a0b0c" stroke-width="2"/>
    <circle cx="614" cy="356" r="34" fill="none" stroke="#4a5058" stroke-width="3" stroke-dasharray="4 5"/>
  </g>

  <!-- ============ layer: dpad (four independent arms) ============ -->
  <g id="layer_dpad_base">
    <circle cx="388" cy="356" r="74" fill="#191c20" stroke="#0d0e10" stroke-width="3"/>
  </g>
  <g id="layer_dpad_up">
    <path fill="url(#dpadFace)" stroke="#0d0e10" stroke-width="2"
      d="M 366,296 L 410,296 L 410,344 L 388,358 L 366,344 Z"/>
    <path d="M 380,318 L 388,306 L 396,318 Z" fill="#6b737d"/>
  </g>
  <g id="layer_dpad_down">
    <path fill="url(#dpadFace)" stroke="#0d0e10" stroke-width="2"
      d="M 366,416 L 410,416 L 410,368 L 388,354 L 366,368 Z"/>
    <path d="M 380,394 L 388,406 L 396,394 Z" fill="#6b737d"/>
  </g>
  <g id="layer_dpad_left">
    <path fill="url(#dpadFace)" stroke="#0d0e10" stroke-width="2"
      d="M 328,334 L 328,378 L 376,378 L 390,356 L 376,334 Z"/>
    <path d="M 350,348 L 338,356 L 350,364 Z" fill="#6b737d"/>
  </g>
  <g id="layer_dpad_right">
    <path fill="url(#dpadFace)" stroke="#0d0e10" stroke-width="2"
      d="M 448,334 L 448,378 L 400,378 L 386,356 L 400,334 Z"/>
    <path d="M 426,348 L 438,356 L 426,364 Z" fill="#6b737d"/>
  </g>

  <!-- ============ layer: face buttons ============ -->
  <g id="layer_btn_a">
    <circle cx="730" cy="318" r="31" fill="url(#faceBtn)" stroke="#2f7d43" stroke-width="3"/>
    <text x="730" y="331" font-family="Segoe UI, Arial" font-size="38" font-weight="700" fill="#4fc06d" text-anchor="middle">A</text>
  </g>
  <g id="layer_btn_b">
    <circle cx="788" cy="260" r="31" fill="url(#faceBtn)" stroke="#8f3038" stroke-width="3"/>
    <text x="788" y="273" font-family="Segoe UI, Arial" font-size="38" font-weight="700" fill="#e05a64" text-anchor="middle">B</text>
  </g>
  <g id="layer_btn_x">
    <circle cx="672" cy="260" r="31" fill="url(#faceBtn)" stroke="#2f5a8f" stroke-width="3"/>
    <text x="672" y="273" font-family="Segoe UI, Arial" font-size="38" font-weight="700" fill="#5a9ae0" text-anchor="middle">X</text>
  </g>
  <g id="layer_btn_y">
    <circle cx="730" cy="202" r="31" fill="url(#faceBtn)" stroke="#8f7a2f" stroke-width="3"/>
    <text x="730" y="215" font-family="Segoe UI, Arial" font-size="38" font-weight="700" fill="#e0c05a" text-anchor="middle">Y</text>
  </g>

  <!-- ============ layer: center cluster ============ -->
  <g id="layer_btn_guide">
    <circle cx="500" cy="196" r="32" fill="url(#faceBtn)" stroke="#3d434b" stroke-width="3"/>
    <circle cx="500" cy="196" r="20" fill="none" stroke="#6b737d" stroke-width="3"/>
  </g>
  <g id="layer_btn_view">
    <circle cx="438" cy="262" r="19" fill="url(#faceBtn)" stroke="#3d434b" stroke-width="2.5"/>
    <rect x="430" y="255" width="10" height="8" fill="none" stroke="#8b939d" stroke-width="2"/>
    <rect x="436" y="259" width="10" height="8" fill="none" stroke="#8b939d" stroke-width="2"/>
  </g>
  <g id="layer_btn_menu">
    <circle cx="562" cy="262" r="19" fill="url(#faceBtn)" stroke="#3d434b" stroke-width="2.5"/>
    <path d="M 554,256 h16 M 554,262 h16 M 554,268 h16" stroke="#8b939d" stroke-width="2.5" fill="none"/>
  </g>
</svg>
