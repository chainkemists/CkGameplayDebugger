<ui version="1">
  <region name="main">
    <column id="tween-inspector" class="tween-inspector">
      <text id="tween-header" class="tween-header">Tween</text>
      <row id="tween-state-row" class="tween-row"><text id="tween-state-label" color-bind="tween-state-diff-color" class="tween-label">State:</text><debug-status id="tween-state-value" label-bind="tween-state" foreground-bind="tween-state-foreground" background-bind="tween-state-background" show-dot="true" class="tween-status" /></row>
      <row id="tween-time-meter-row" visible="tween-has-duration" class="tween-row"><text id="tween-time-meter-label" color-bind="tween-time-diff-color" class="tween-label">Time:</text><row id="tween-time-meter-value" class="tween-meter"><debug-meter id="tween-time-meter" fraction-bind="tween-time-fraction" fill-bind="tween-time-fill" width="72" height="6" /><text id="tween-time-meter-text" bind="tween-time" class="tween-value tween-number" /></row></row>
      <row id="tween-time-plain-row" visible="tween-no-duration" class="tween-row"><text id="tween-time-plain-label" color-bind="tween-time-diff-color" class="tween-label">Time:</text><text id="tween-time-plain-value" bind="tween-time" class="tween-value tween-number" /></row>
      <row id="tween-loop-row" class="tween-row"><text id="tween-loop-label" color-bind="tween-loop-diff-color" class="tween-label">Loop:</text><text id="tween-loop-value" bind="tween-loop" class="tween-value tween-number" /></row>
      <row id="tween-reversed-row" class="tween-row"><text id="tween-reversed-label" color-bind="tween-reversed-diff-color" class="tween-label">Reversed:</text><text id="tween-reversed-value" bind="tween-reversed" color-bind="tween-reversed-color" class="tween-value" /></row>
      <row id="tween-multiplier-row" class="tween-row"><text id="tween-multiplier-label" color-bind="tween-multiplier-diff-color" class="tween-label">Time Multiplier:</text><text id="tween-multiplier-value" bind="tween-multiplier" class="tween-value tween-number" /></row>
      <column id="tween-controls-section" visible="tween-can-controls" class="tween-controls"><text id="tween-controls-header" class="tween-header">Controls</text>
      <row id="tween-playback-row" class="tween-row"><text id="tween-playback-label" color-bind="tween-playback-diff-color" class="tween-label">Playback:</text><row id="tween-playback-actions" class="tween-actions"><debug-inspector-action id="tween-pause" label-bind="tween-pause-label" action="tween-pause" enabled-bind="tween-can-request" disabled-reason-bind="tween-disabled-reason" class="tween-action" /><debug-inspector-action id="tween-resume" label-bind="tween-resume-label" action="tween-resume" enabled-bind="tween-can-request" disabled-reason-bind="tween-disabled-reason" class="tween-action" /><debug-inspector-action id="tween-restart" label-bind="tween-restart-label" action="tween-restart" enabled-bind="tween-can-request" disabled-reason-bind="tween-disabled-reason" class="tween-action" /></row></row>
      <row id="tween-stop-behavior-row" class="tween-row"><text id="tween-stop-behavior-label" color-bind="tween-stop-behavior-diff-color" class="tween-label">Stop Behavior:</text><native id="tween-stop-behavior-native" bind="tween-stop-behavior-port" class="tween-native" /></row>
      <row id="tween-stop-row" class="tween-row"><text id="tween-stop-label" color-bind="tween-stop-diff-color" class="tween-label">Stop:</text><debug-inspector-action id="tween-stop" label-bind="tween-stop-label" action="tween-stop" enabled-bind="tween-can-request" disabled-reason-bind="tween-disabled-reason" class="tween-action" /></row>
      <row id="tween-set-multiplier-row" class="tween-row"><text id="tween-set-multiplier-label" color-bind="tween-set-multiplier-diff-color" class="tween-label">Set Time Multiplier:</text><native id="tween-multiplier-native" bind="tween-multiplier-port" class="tween-native" /></row></column>
      <column id="tween-chain-section" visible="tween-has-chain" class="tween-chain"><text id="tween-chain-header" class="tween-header">Chain</text><row id="tween-next-row" class="tween-row"><text id="tween-next-label" color-bind="tween-next-diff-color" class="tween-label">Next Tween:</text><text id="tween-next-value" bind="tween-next" class="tween-value tween-handle" /></row></column>
    </column>
  </region>
</ui>
